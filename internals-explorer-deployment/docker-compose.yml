version: '3.5'

networks:
  application:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

services:
  database:
    container_name: ckompiler-database
    restart: unless-stopped
    image: postgres:16.16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./volume/postgres:/data/postgres
      - ./volume/pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - application

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: ckompiler-prometheus
    restart: unless-stopped
    volumes:
      - ./volume/promdata:/prometheus
    expose:
      - "9090"
    networks:
      - application

  grafana:
    image: grafana/grafana:13.3.1
    container_name: ckompiler-grafana
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - application
