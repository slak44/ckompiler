version: '3.5'

networks:
  gateway:
  docker-api:
    internal: true

services:
  internals-explorer-backend:
    depends_on:
      - database
    container_name: ckompiler-internals-explorer-backend
    restart: unless-stopped
    image: ghcr.io/slak44/ckompiler-backend:latest
    environment:
      spring.profiles.active: production
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/ # /run/secrets/POSTGRES_PASSWORD -> ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_USER: ${POSTGRES_USER}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    expose:
      - "8080"
    networks:
      - application
      - gateway

  gateway:
    container_name: ckompiler-gateway
    restart: always # signalled via the API, which makes unless-stopped skip it at boot
    image: nginx:1.31.9-alpine
    labels:
      - com.github.nginx-proxy.nginx-proxy.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam/dhparam.pem:ro
      - ./volume/conf.d:/etc/nginx/conf.d:ro
      - ./volume/certs:/etc/nginx/certs:ro
      - ./nginx-vhost.d:/etc/nginx/vhost.d:ro
      - ./volume/html:/usr/share/nginx/html:ro
    networks:
      - application
      - gateway

  docker-socket-proxy:
    container_name: ckompiler-docker-socket-proxy
    restart: unless-stopped
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    user: "65534:107" # host docker gid
    read_only: true
    mem_limit: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - -loglevel=INFO
      - -listenip=0.0.0.0
      - -allowfrom=ckompiler-docker-gen,ckompiler-acme-companion
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|info|events|networks|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json)
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/kill
      - -watchdoginterval=60
      - -stoponwatchdog
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  docker-gen:
    depends_on:
      - gateway
      - docker-socket-proxy
    container_name: ckompiler-docker-gen
    restart: always # signalled via the API, which makes unless-stopped skip it at boot
    image: nginxproxy/nginx-proxy:1.11.6-dockergen
    environment:
      DOCKER_HOST: tcp://ckompiler-docker-socket-proxy:2375
      ENABLE_IPV6: true
      TRUST_DOWNSTREAM_PROXY: false
    volumes:
      - ./volume/conf.d:/etc/nginx/conf.d
      - ./nginx/dhparam.pem:/etc/nginx/dhparam/dhparam.pem:ro
      - ./volume/certs:/etc/nginx/certs:ro
      - ./nginx-vhost.d:/etc/nginx/vhost.d:ro
      - ./volume/html:/usr/share/nginx/html:ro
    networks:
      - docker-api

  acme-companion:
    container_name: ckompiler-acme-companion
    restart: unless-stopped
    image: nginxproxy/acme-companion:2.8.2
    depends_on:
      - docker-socket-proxy
    volumes:
      - ./volume/certs:/etc/nginx/certs
      - ./volume/vhost:/etc/nginx/vhost.d
      - ./volume/html:/usr/share/nginx/html
      - ./volume/acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: ${DEFAULT_EMAIL}
      DOCKER_HOST: tcp://ckompiler-docker-socket-proxy:2375
      NGINX_PROXY_CONTAINER: ckompiler-gateway
      NGINX_DOCKER_GEN_CONTAINER: ckompiler-docker-gen
    networks:
      - default
      - docker-api

  prometheus:
    volumes:
      - ./monitoring/prometheus-production.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    environment:
      VIRTUAL_PORT: 3000
      VIRTUAL_HOST: grafana.ckompiler.slak44.dev
      LETSENCRYPT_HOST: grafana.ckompiler.slak44.dev
    networks:
      - gateway
